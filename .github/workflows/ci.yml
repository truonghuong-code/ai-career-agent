name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ai_career_agent
          POSTGRES_USER: ai_career_agent
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_career_agent -d ai_career_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AI_CAREER_AGENT_DATABASE_URL: postgresql+asyncpg://ai_career_agent:test-password@localhost:5432/ai_career_agent
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run Ruff lint
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest
