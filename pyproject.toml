[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-career-agent"
version = "0.1.0"
description = "AI-powered career development backend for AI Engineer and BrSE paths."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",
    "fastapi>=0.115,<1.0",
    "openai>=1.58,<2.0",
    "pgvector>=0.3,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "pypdf>=5.1,<6.0",
    "python-docx>=1.1,<2.0",
    "python-multipart>=0.0.18,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "ruff>=0.8,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
