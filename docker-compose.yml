services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      AI_CAREER_AGENT_ENVIRONMENT: docker
      AI_CAREER_AGENT_DEBUG: "false"
      AI_CAREER_AGENT_LOG_LEVEL: INFO
      AI_CAREER_AGENT_DATABASE_URL: postgresql+asyncpg://ai_career_agent:change-me@db:5432/ai_career_agent
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_career_agent}
      POSTGRES_USER: ${POSTGRES_USER:-ai_career_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
